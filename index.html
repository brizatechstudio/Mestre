<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07101f" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="description" content="MESTRE — orçamentos rápidos e profissionais para autônomos." />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('mestre.settings') || '{}')
        const appearance = saved.appearance === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = appearance
        document.documentElement.style.colorScheme = appearance
      } catch {
        document.documentElement.dataset.theme = 'dark'
        document.documentElement.style.colorScheme = 'dark'
      }
    </script>
    <title>MESTRE — Orçamentos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
